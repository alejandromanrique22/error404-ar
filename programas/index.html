<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020715">
  <title>Programas | Error 404</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖥️</text></svg>">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-page="programas" data-base="../" data-tagline="DESCUBRÍ SOFTWARE CLÁSICO" data-menu="Explorar programas" data-foot="Archivo de software clásico" data-json="programas.json">
<div id="site-header"></div>
<div class="page-wrapper">
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="crumb">ERROR 404 / BIBLIOTECA / PROGRAMAS</div>
      <section class="hero">
        <div class="eyebrow">✦ ARCHIVO DIGITAL · SOFTWARE RETRO</div>
        <h1>Programas para volver a otra época.</h1>
        <p>Reproductores, utilidades y herramientas clásicas que acompañaron a toda una generación de PCs.</p>
      </section>

      <section class="toolbar" aria-label="Filtros del catálogo">
        <input class="field" id="search" type="search" placeholder="Buscar Winrar, VLC, 7Zip..." aria-label="Buscar">
        <select class="field" id="category" aria-label="Filtrar por categoría"><option value="Todos">Todas las categorías</option></select>
        <select class="field" id="sort" aria-label="Ordenar catálogo">
          <option value="featured">Orden recomendado</option>
          <option value="az">Nombre A–Z</option>
          <option value="za">Nombre Z–A</option>
        </select>
      </section>
      <div class="stats"><span><strong id="count">0</strong> programas en el catálogo</span></div>
      <section class="cards" id="catalogo" aria-live="polite"></section>
      <div class="pagination" id="pagination"></div>

      <footer class="foot" id="foot"></footer>
    </main>
  </div>
</div>
<script src="data.js"></script>
<script src="../layout.js"></script>
<script src="../catalog.js"></script>
</body>
</html>
